# Fleetcor client configuration for the Daily Health Check.
# Account/role and log group/stream names below are sourced from the existing
# SingleClientChecks/FleetCor project (bootstrap.py CLIENTS + FleetCor/config.py).
# RDS/EC2/ASG resources are still discovered dynamically via tag filters at run time.

aws:
  account_id: "444521715692"
  role_arn: "arn:aws:iam::444521715692:role/FinOpsAutomationRole"
  profile: null
  regions: []   # empty -> auto-discover enabled regions for the account

rds:
  enabled: true
  # Only report production-named RDS instances/clusters (excludes dev/test/qa/uat/sandbox).
  production_only: true

ec2:
  enabled: true
  # No tag filter - scans the whole account; production_only below narrows the results.
  tag_filters: []
  production_only: true
  memory_metric_namespace: "CWAgent"

ui:
  enabled: true
  # Real UI-check Lambda log group (SingleClientChecks/FleetCor/config.py LOG_GROUPS["ui"]).
  log_group: "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  query_hours: 3   # matches lookback_minutes=180 in the reference console query

# Maps to the existing "DXV" dashboard check (Acquisition Success Files),
# reported via the same check_acq_success.log stream as ACQ Flags below.
dxv:
  enabled: true
  log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
  log_stream_pattern: "check_acq_success.log"
  query_hours: 168   # 7 days, matches the original 604800s console query
  tag_filters: []

asg:
  enabled: true
  tag_filters: []
  production_only: true

kafka:
  enabled: false
  bootstrap_servers_env: "FLEETCOR_KAFKA_BOOTSTRAP_SERVERS"
  consumer_groups: []

cloudwatch:
  lookback_hours: 24
  # Real log groups used by FleetCor's existing check scripts (SingleClientChecks/FleetCor/config.py).
  log_group_prefixes:
    - "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
    - "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  required_log_groups:
    - "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
    - "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  required_metrics:
    - namespace: "AWS/RDS"
      metric_name: "FreeStorageSpace"

database:
  enabled: true
  engine: "postgresql"
  host_env: "FLEETCOR_DB_HOST"
  port_env: "FLEETCOR_DB_PORT"
  name_env: "FLEETCOR_DB_NAME"
  user_env: "FLEETCOR_DB_USER"
  password_env: "FLEETCOR_DB_PASSWORD"
  timeout_seconds: 5

# FleetCor's watchlist infrastructure exists but is currently disabled in production
# (confirmed via real logs: "No watchlist in use, exiting script.") - reported as
# NOT CONFIGURED rather than a false COMPLETED/FAILED.
watchlist:
  enabled: true
  title: "Watchlist Import (World-Check)"
  sources:
    - name: "World-Check Watchlist Import"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "downloadWatchlist.log"
      query_hours: 24
      not_configured_markers:
        - "No watchlist in use"

# Batch File Acquisition (DPA) - landing-file polling/acquisition from the data provider.
batch_file:
  enabled: true
  title: "Batch File Acquisition (DPA)"
  batches:
    - name: "Batch File Acquisition (DPA)"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "pollDXVLanding.log"
      query_hours: 24

# Batch Completion - overall daily batch-cycle status, checked every few minutes.
wlm:
  enabled: true
  title: "Batch Completion"
  batches:
    - name: "Batch Completion"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "currentBatchStatus.log"
      query_hours: 24

# ACQ Feedback Flag - same evidence stream as the Infrastructure "DXV" check, viewed
# here as an application-level acquisition-feedback confirmation (matches the real
# FleetCor dashboard's separate "DXV" vs "ACQ Flags" checks on the same log stream).
aml:
  enabled: true
  title: "ACQ Feedback Flag"
  batches:
    - name: "ACQ Feedback Flag"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "check_acq_success.log"
      query_hours: 168   # 7 days, matches the original 604800s console query
      detail_regex: "(?i)(acq_success_\\S+)"   # e.g. acq_success_20260807.flag
      detail_target: "status"
      success_label: "Sent"
      failure_label: "Not Sent"

# Bad-record Output - NetReveal_BAD ZIP generation (feedback of rejected records).
cdd:
  enabled: true
  title: "Bad-record Output"
  batches:
    - name: "Bad-record Output"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "check_bad_files.log"
      query_hours: 168   # 7 days, matches the original 604800s console query
      detail_regex: "(NetReveal_BAD_\\d+\\.ZIP)"
      detail_target: "status"
      success_label: "Sent"
      failure_label: "Not Sent"

# No start/completion timestamp evidence exists in the current FleetCor check
# scripts (only latest-message keyword checks) - left unconfigured rather than
# inventing start/expected-completion markers that aren't backed by evidence.
overrun:
  enabled: false
  batches: []
