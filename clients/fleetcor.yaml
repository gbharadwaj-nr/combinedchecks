# Fleetcor client configuration for the Daily Health Check.
# Account/role and log group/stream names below are sourced from the existing
# SingleClientChecks/FleetCor project (bootstrap.py CLIENTS + FleetCor/config.py).
# RDS/EC2/ASG resources are still discovered dynamically via tag filters at run time.

aws:
  account_id: "444521715692"
  role_arn: "arn:aws:iam::444521715692:role/FinOpsAutomationRole"
  profile: null
  # Pinned to the confirmed real region (RDS/EC2/EFS/log group all live here) -
  # skips scanning the other ~16 enabled-but-unused regions on every check.
  # Clear this back to [] if resources ever get added in another region.
  regions: ["ca-central-1"]

rds:
  enabled: true
  # Only report production-named RDS instances/clusters (excludes dev/test/qa/uat/sandbox).
  production_only: true

ec2:
  enabled: true
  # No tag filter - scans the whole account; production_only below narrows the results.
  tag_filters: []
  production_only: true
  memory_metric_namespace: "CWAgent"

ui:
  enabled: true
  # Real UI-check Lambda log group (SingleClientChecks/FleetCor/config.py LOG_GROUPS["ui"]).
  log_group: "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  query_hours: 3   # matches lookback_minutes=180 in the reference console query

asg:
  enabled: true
  tag_filters: []
  production_only: true

kafka:
  # Not required for now - no confirmed Kafka Consumer Lag metric source yet.
  # Re-enable once the real namespace/metric/dimension is confirmed.
  enabled: false
  cluster_name: "fltcr-production"
  metric_namespace: "AWS/Kafka"
  metric_name: "SumOffsetLag"
  dimension_name: "Cluster Name"
  lag_warning_threshold: 1000
  lag_critical_threshold: 10000

efs:
  enabled: true
  warning_percent: 75
  critical_percent: 90
  filesystems:
    - name: "EFS fs-0dabd9143238d32d6"
      filesystem_id: "fs-0dabd9143238d32d6"
    - name: "EFS fs-075f6e20969290f33"
      filesystem_id: "fs-075f6e20969290f33"

cloudwatch:
  lookback_hours: 24
  # Real log groups behind the fltcr-production-HealthCheck CloudWatch dashboard.
  log_group_prefixes:
    - "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
    - "fltcr-production-SystemLogs-XMuMIIZ31HNw"
    - "fltcr-production-CloudFormationLogs-6LU2BQOg1Z9k"
    - "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  required_log_groups:
    - "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
    - "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  required_metrics:
    - namespace: "AWS/RDS"
      metric_name: "FreeStorageSpace"

# FleetCor's application section is just these 2 real checks, confirmed
# directly against the CloudWatch console (fltcr-production-ApplicationLogs-
# t0L7QoJyJRKY / batch/i-01fb43de9bcae4ff6/batch/runBatch.log) - NOT the
# generic ACQ/WLM/AML/CDD schema MGL uses, since FleetCor's real evidence
# doesn't match that shape. Fetches only the latest matching event per
# keyword from the last 24 hours. Reuses the same generic log-discovery
# module built for MGL (checks/mgl_log_discovery_check.py - the code isn't
# MGL-specific, only the config values are).
log_discovery:
  enabled: true
  title: "FleetCor Application Log Discovery"
  entries:
    # 1. BAD File.
    - name: "BAD File"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "batch/i-01fb43de9bcae4ff6/batch/runBatch.log"
      required_markers:
        - "BAD"
      limit: 200
      query_hours: 24
      max_matches: 1

    # 2. Batch Process.
    - name: "Batch Process"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "batch/i-01fb43de9bcae4ff6/batch/runBatch.log"
      required_markers:
        - "Creating"
      limit: 200
      query_hours: 24
      max_matches: 1

