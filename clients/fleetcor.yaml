# Fleetcor client configuration for the Daily Health Check.
# Account/role and log group/stream names below are sourced from the existing
# SingleClientChecks/FleetCor project (bootstrap.py CLIENTS + FleetCor/config.py).
# RDS/EC2/ASG resources are still discovered dynamically via tag filters at run time.

aws:
  account_id: "444521715692"
  role_arn: "arn:aws:iam::444521715692:role/FinOpsAutomationRole"
  profile: null
  # Pinned to the confirmed real region (RDS/EC2/EFS/log group all live here) -
  # skips scanning the other ~16 enabled-but-unused regions on every check.
  # Clear this back to [] if resources ever get added in another region.
  regions: ["ca-central-1"]

rds:
  enabled: true
  # Only report production-named RDS instances/clusters (excludes dev/test/qa/uat/sandbox).
  production_only: true

ec2:
  enabled: true
  # No tag filter - scans the whole account; production_only below narrows the results.
  tag_filters: []
  production_only: true
  memory_metric_namespace: "CWAgent"

ui:
  enabled: true
  # Real UI-check Lambda log group (SingleClientChecks/FleetCor/config.py LOG_GROUPS["ui"]).
  log_group: "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  query_hours: 3   # matches lookback_minutes=180 in the reference console query

# DXV disabled - its only evidence source (check_acq_success.log) is already
# covered by the ACQ entry under batch_file below; keeping both is duplicate noise.
dxv:
  enabled: false
  log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
  log_stream_pattern: "check_acq_success.log"
  query_hours: 168   # 7 days, matches the original 604800s console query
  tag_filters: []

asg:
  enabled: true
  tag_filters: []
  production_only: true

kafka:
  # Not required for now - no confirmed Kafka Consumer Lag metric source yet.
  # Re-enable once the real namespace/metric/dimension is confirmed.
  enabled: false
  cluster_name: "fltcr-production"
  metric_namespace: "AWS/Kafka"
  metric_name: "SumOffsetLag"
  dimension_name: "Cluster Name"
  lag_warning_threshold: 1000
  lag_critical_threshold: 10000

efs:
  enabled: true
  warning_percent: 75
  critical_percent: 90
  filesystems:
    - name: "EFS fs-0dabd9143238d32d6"
      filesystem_id: "fs-0dabd9143238d32d6"
    - name: "EFS fs-075f6e20969290f33"
      filesystem_id: "fs-075f6e20969290f33"

cloudwatch:
  lookback_hours: 24
  # Real log groups behind the fltcr-production-HealthCheck CloudWatch dashboard.
  log_group_prefixes:
    - "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
    - "fltcr-production-SystemLogs-XMuMIIZ31HNw"
    - "fltcr-production-CloudFormationLogs-6LU2BQOg1Z9k"
    - "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  required_log_groups:
    - "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
    - "/aws/lambda/fltcrproductionUIAvailabilityCheck"
  required_metrics:
    - namespace: "AWS/RDS"
      metric_name: "FreeStorageSpace"

# Simple, reusable application format: ACQ / WLM / AML / CDD. Every client is
# expected to configure whichever of these four it actually has - the rest are
# just left enabled: false (reported as "Not Present", not a failure).
# FleetCor's watchlist infrastructure exists but is currently disabled in
# production (real logs: "No watchlist in use, exiting script.") - not one of
# the 4 standard checks, so left out entirely rather than shown as unavailable.
watchlist:
  enabled: false
  sources: []

# ACQ - file acquisition/receipt confirmation.
batch_file:
  enabled: true
  batches:
    - name: "ACQ"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "check_acq_success.log"
      query_hours: 168   # 7 days, matches the original 604800s console query

# WLM - watchlist management/screening batch.
wlm:
  enabled: true
  batches:
    - name: "WLM"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "wlm_batch_monitoring.log"
      query_hours: 168   # 7 days, matches the original 604800s console query

# AML - anti-money-laundering batch.
aml:
  enabled: true
  batches:
    - name: "AML"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "aml_batch_monitoring.log"
      query_hours: 3   # 3 hours, matches the original 10800s console query

# CDD - customer due diligence SLA monitoring.
cdd:
  enabled: true
  batches:
    - name: "CDD"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "CDD_SLA_Daily_Messages.log"
      query_hours: 24

# Simple catch-all for the remaining fltcr-production-HealthCheck dashboard
# widgets: add one entry per log stream to monitor - no new code required.
# ("Payment Ingestion" removed for now - not required yet and the real log
# stream name wasn't confirmed; closest match found was check_payment_response.log.)
log_health:
  enabled: true
  entries:
    - name: "DXV Landing"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "pollDXVLanding.log"
      query_hours: 24
    - name: "Bad Files"
      log_group: "fltcr-production-ApplicationLogs-t0L7QoJyJRKY"
      log_stream_pattern: "check_bad_files.log"
      query_hours: 168

# No start/completion timestamp evidence exists in the current FleetCor check
# scripts (only latest-message keyword checks) - left unconfigured rather than
# inventing start/expected-completion markers that aren't backed by evidence.
overrun:
  enabled: false
  batches: []

