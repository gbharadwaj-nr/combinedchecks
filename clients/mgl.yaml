# MGL client configuration for the Daily Health Check.
# Account/role/log group/stream names sourced from the existing
# SingleClientChecks/MGL project (config.py + bootstrap.py).
#
# NOTE: MGL's real automation account below (616476889381) differs from the
# "MGL" entry in DailyChecksFramework/bootstrap.py's CLIENTS dict (984546913585).
# This is intentional and confirmed via a comment in SingleClientChecks/MGL/config.py -
# using the real, actually-used value here rather than the DailyChecksFramework one.

aws:
  account_id: "616476889381"
  role_arn: "arn:aws:iam::616476889381:role/FinOpsAutomationRole"
  profile: null
  regions: []   # empty -> auto-discover enabled regions for the account
  # This account is shared by 4 clients (MGL, LFS, IAG, Suncorp) - "production"
  # alone isn't enough to scope resources to just MGL (e.g. instance names like
  # "app2.production.mgl.nrod"). Required alongside production_only in
  # rds/ec2/asg/dxv checks so other clients' resources are never picked up.
  resource_name_filter: "mgl"

rds:
  enabled: true
  production_only: true

ec2:
  enabled: true
  tag_filters: []
  production_only: true
  memory_metric_namespace: "CWAgent"

ui:
  enabled: true
  log_group: "/aws/lambda/mglproductionUIAvailabilityCheck"
  query_hours: 3   # matches lookback_minutes=180 in the reference console query

# "Once envelope arrives, check for start of the batch" - pollDXVLanding.log has
# 2 real streams (different hosts); the bare filename substring match below
# catches both without needing to hardcode either instance ID.
dxv:
  enabled: true
  log_group: "mgl-production-ApplicationLogs-1GIG4IOL2HSFZ"
  log_stream_pattern: "pollDXVLanding.log"
  required_markers:
    - "fn_setup_script - START"
  limit: 200   # 2 chatty streams share this filter - default 20 was crowding out the marker
  query_hours: 24
  tag_filters: []

asg:
  enabled: true
  tag_filters: []
  production_only: true

kafka:
  enabled: false
  bootstrap_servers_env: "MGL_KAFKA_BOOTSTRAP_SERVERS"
  consumer_groups: []

cloudwatch:
  lookback_hours: 24
  log_group_prefixes:
    - "mgl-production-ApplicationLogs-1GIG4IOL2HSFZ"
    - "/aws/lambda/mglproductionUIAvailabilityCheck"
  required_log_groups:
    - "mgl-production-ApplicationLogs-1GIG4IOL2HSFZ"
    - "/aws/lambda/mglproductionUIAvailabilityCheck"
  required_metrics:
    - namespace: "AWS/RDS"
      metric_name: "FreeStorageSpace"

# Database Validation is disabled until real MGL_DB_* connection details are provided
# (matches the SingleClientChecks/MGL/config.py comment - lib/db_check.py is ready,
# just not wired to real credentials yet). Set the env vars below in Jenkins to enable.
database:
  enabled: true
  engine: "postgresql"
  host_env: "MGL_DB_HOST"
  port_env: "MGL_DB_PORT"
  name_env: "MGL_DB_NAME"
  user_env: "MGL_DB_USER"
  password_env: "MGL_DB_PASSWORD"
  timeout_seconds: 5

# "Check on the world check daily and delete" - batch/norkom.log, keyword "worldcheck".
watchlist:
  enabled: true
  sources:
    - name: "World-Check Daily"
      log_group: "mgl-production-ApplicationLogs-1GIG4IOL2HSFZ"
      log_stream_pattern: "batch/norkom.log"
      required_markers:
        - "worldcheck"
      limit: 200   # norkom.log is chatty - default 20 was crowding out the daily marker
      query_hours: 24

# No separate ACQ file-acquisition evidence beyond what dxv (envelope arrival) and
# wlm (acquisition+WLM completion) below already cover - avoids duplicate noise.
batch_file:
  enabled: false
  batches: []

# "Acquisition triggered first, followed by WLM" - runBatch.log, keyword
# "Batch Processing Completed" (only fires on an automated run, not a manual one).
wlm:
  enabled: true
  batches:
    - name: "Acquisition + WLM Batch"
      log_group: "mgl-production-ApplicationLogs-1GIG4IOL2HSFZ"
      log_stream_pattern: "runBatch.log"
      required_markers:
        - "Batch Processing Completed"
      limit: 200   # runBatch.log is chatty - default 20 was crowding out the marker
      query_hours: 12   # matches lookback_minutes=720 in the reference

# No dedicated AML batch check in the existing MGL check list - Not Present.
aml:
  enabled: false
  batches: []

# No CDD processing in the existing MGL check list - Not Present.
cdd:
  enabled: false
  batches: []

# "Check on index completion" - batch/norkom.log, keyword "Finished executing
# procedure IndexReportProcedure." (can appear multiple times per run - any match counts).
log_health:
  enabled: true
  entries:
    - name: "Index Completion"
      log_group: "mgl-production-ApplicationLogs-1GIG4IOL2HSFZ"
      log_stream_pattern: "batch/norkom.log"
      required_markers:
        - "Finished executing procedure IndexReportProcedure."
      query_hours: 24

# No start/completion timestamp evidence exists in the current MGL check scripts
# (only latest-message keyword checks) - left unconfigured rather than inventing
# start/expected-completion markers that aren't backed by evidence.
overrun:
  enabled: false
  batches: []
